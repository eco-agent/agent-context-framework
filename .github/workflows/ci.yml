name: Repository Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Vite Plus, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.14.0
          cache: true

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: vp install

      - name: Check generated registry
        run: pnpm registry:check

      - name: Check formatting and lint
        run: vp check

      - name: Verify branch
        run: vp run --workspace-root verify:branch
