name: Verify capsule bootstrap repair

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.14.0
          cache: true
      - name: Build workspace
        run: vp run --workspace-root build
      - name: Prepare capsule runtime
        run: vp run --workspace-root capsule:runtime:prepare
      - name: Verify tracked bootstrap
        run: node --import tsx --test tools/dev-tooling/test/context-capsule-bootstrap.test.ts
