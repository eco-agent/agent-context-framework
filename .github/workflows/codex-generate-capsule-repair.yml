name: Generate capsule bootstrap repair

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.14.0
          cache: true
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: vp install
      - name: Regenerate bootstrap and capsule
        run: |
          vp run --workspace-root capsule:bootstrap:build
          vp run --workspace-root registry:build
          vp run --workspace-root agent-context -- pack --cwd .
      - name: Verify generated repair
        run: vp run --workspace-root verify:profile -- full
      - name: Collect generated files
        run: |
          mkdir generated-repair
          git diff --name-only -z | tar --null -T - -czf generated-repair/generated-files.tar.gz
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-repair
          path: generated-repair/generated-files.tar.gz
          if-no-files-found: error
          retention-days: 1
