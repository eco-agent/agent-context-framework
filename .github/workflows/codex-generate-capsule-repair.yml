name: Generate capsule bootstrap repair

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.14.0
          cache: true
      - name: Restore the capsule baseline projection
        run: |
          git fetch --depth=1 origin development
          git show FETCH_HEAD:.codex/acf/bootstrap.mjs > .codex/acf/bootstrap.mjs
      - name: Regenerate bootstrap and capsule
        run: |
          vp run --workspace-root capsule:bootstrap:build
          vp run --workspace-root registry:build
          vp run --workspace-root agent-context -- pack --cwd .
      - name: Verify generated repair
        run: vp run --workspace-root verify:profile full
      - name: Collect generated files
        if: always()
        run: |
          mkdir generated-repair
          git diff --name-only -z | tar --null -T - -czf generated-repair/generated-files.tar.gz
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-repair
          path: generated-repair/generated-files.tar.gz
          if-no-files-found: error
          retention-days: 1
