model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[mcp_servers.repo_context]
command = "node"
args = [".codex/acf/bootstrap.mjs", "exec", "repo-context"]
required = true
startup_timeout_sec = 20
tool_timeout_sec = 15
enabled_tools = ["repo_context"]

[agents]
interrupt_message = true

[agents.default]
description = "Sol Medium domain agent for continuing implementation and maintenance."
config_file = "./agents/default.toml"

[agents.scout]
description = "Read-only Luna xHigh retriever for bounded source-based context gathering."
config_file = "./agents/scout.toml"

[agents.investigator]
description = "Read-only Luna Max investigator for small independent questions that justify deeper inference."
config_file = "./agents/investigator.toml"
